# XcodeGen spec: `xcodegen generate` in this folder makes SaintMobile.xcodeproj (macOS).
# The app is the SwiftUI target below; everything that isn't user interface lives in the SaintCore package
# (Package.swift), which has its own tests: `swift test`.
name: SaintMobile

options:
  bundleIdPrefix: app.saint
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    # SaintCore is plain Swift 5; the app was written without strict concurrency checking.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    # Put your Apple ID's team here to run on your phone from Xcode (a free account works), or leave it empty:
    # the CI build and Sideloadly sign the app themselves.
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: YES

packages:
  SaintCore:
    path: .

targets:
  SaintMobile:
    type: application
    platform: iOS
    sources:
      - path: SaintMobile
    dependencies:
      - package: SaintCore
        product: SaintCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.saint.mobile
        PRODUCT_NAME: SAINT
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SaintMobile/Info.plist
        SUPPORTS_MACCATALYST: NO
    info:
      path: SaintMobile/Info.plist
      properties:
        CFBundleDisplayName: SAINT
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Keeps the microphone session (and so the app) alive in the background: this is what makes
        # "always listening for SAINT" work with the screen locked.
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: SAINT listens for its name and your commands. Audio is processed on this phone where iOS allows it.
        NSSpeechRecognitionUsageDescription: SAINT turns what you say into commands, on this phone where possible.
        NSCameraUsageDescription: Scan the pairing code that SAINT shows on your PC, take photos and videos when you ask, and switch the flashlight.
        NSContactsUsageDescription: So “call mom” or “text Alex I'm on my way” finds the right person. Your contacts stay on this phone.
        NSPhotoLibraryAddUsageDescription: Photos and videos SAINT takes for you are saved to your library.
        NSLocalNetworkUsageDescription: SAINT finds your PC and your other devices on your Wi-Fi and talks to them over an encrypted link.
        NSBonjourServices:
          - _saint._tcp
        # saint://pair?… (pairing links), saint://spotify-callback (Spotify sign-in), saint://shortcut-done (back from Shortcuts)
        CFBundleURLTypes:
          - CFBundleURLName: app.saint.mobile
            CFBundleURLSchemes:
              - saint
        # Files received from your PC land in Files → SAINT → From my devices
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false

schemes:
  SaintMobile:
    build:
      targets:
        SaintMobile: all
    run:
      config: Debug
    archive:
      config: Release
