name: Windows desktop release

on:
  push:
    branches: [unified-release, claude/saint-windows-pipeline-import-vxg7gs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify toolchain
        shell: pwsh
        run: |
          python --version
          pip --version
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup" }
          }
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
      - name: Run automated tests
        shell: pwsh
        run: python -m pytest -q
      - name: Build SAINT installer
        shell: pwsh
        run: python packaging/windows/build.py --no-models
      - name: Prepare large GitHub model assets
        shell: pwsh
        env:
          # Optional: raises Hugging Face rate limits; the build works without it.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python packaging/windows/prepare_model_assets.py
      - name: Verify model assets install correctly
        shell: pwsh
        run: python packaging/windows/verify_assets.py
      - name: Verify release files
        shell: pwsh
        run: |
          if (!(Test-Path "build/windows/SAINT-Setup.exe")) { throw "SAINT-Setup.exe was not produced" }
          if (!(Test-Path "build/windows/SAINT/SAINT.exe")) { throw "SAINT.exe was not produced" }
          if (!(Test-Path "build/release-assets/faster-whisper-base.en.zip")) { throw "Whisper asset was not produced" }
          if (!(Test-Path "build/release-assets/kokoro-onnx.zip")) { throw "Kokoro asset was not produced" }
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SAINT-Windows-${{ github.sha }}
          path: |
            build/windows/SAINT-Setup.exe
            build/windows/SAINT
            build/release-assets/*.zip
            build/release-assets/model-assets.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish rolling GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "unified-latest"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
          }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "SAINT unified-release (latest)" --notes "Automated Windows build from commit $env:GITHUB_SHA. Download SAINT-Setup.exe; SAINT downloads large voice models from the same release on first launch." --prerelease --latest=false
          gh release upload $tag "build/windows/SAINT-Setup.exe#SAINT Windows Installer" "build/release-assets/faster-whisper-base.en.zip#Whisper base.en model" "build/release-assets/kokoro-onnx.zip#Kokoro ONNX voice model" "build/release-assets/model-assets.json#Model manifest" --repo $env:GITHUB_REPOSITORY --clobber
